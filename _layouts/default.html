<!doctype html>
<html lang="{{ site.lang | default: 'zh-Hant' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="shell nav-row">
        <a class="brand" href="{{ '/' | relative_url }}">
          <span class="brand-mark">PD</span>
          <span>{{ site.title }}</span>
        </a>
        <a class="nav-link" href="{{ '/' | relative_url }}">文章總覽</a>
      </div>
    </header>

    <main class="shell page-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="shell footer-row">
        <span>Daily Paper Scout</span>
        <a href="https://github.com/{{ site.repository }}">GitHub repository</a>
      </div>
    </footer>
  </body>
</html>
