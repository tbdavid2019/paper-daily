name: Daily Paper Crawl

on:
  schedule:
    # UTC 02:00 Monday-Friday = UTC+8 10:00 Monday-Friday (Taiwan time).
    # This is after arXiv's Sunday-Thursday 20:00 US-Eastern announcements.
    - cron: '0 2 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'Discovery report date (YYYY-MM-DD). Empty uses current UTC day.'
        required: false
        type: string
      topic:
        description: 'Topic profile from config/topics.json'
        required: false
        default: 'embodied_ai'
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-paper-pipeline
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run crawler
        run: python scripts/crawl.py
        env:
          SCOUT_DATE: ${{ inputs.date || '' }}
          PAPER_TOPIC: ${{ inputs.topic || 'embodied_ai' }}

      - name: Commit and push data
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "📥 papers $(date +%Y-%m-%d)"
            git push
          fi

      - name: Generate daily LLM report
        run: python scripts/generate_blog.py
        env:
          REPORT_DATE: ${{ inputs.date || '' }}
          PAPER_TOPIC: ${{ inputs.topic || 'embodied_ai' }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          BLOG_MAX_PAPERS: '10'

      - name: Commit and push blog post
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add _posts/
          if ! git diff --cached --quiet; then
            git commit -m "📝 report $(date +%Y-%m-%d)"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
